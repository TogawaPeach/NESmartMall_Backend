spring:
  application:
    name: mall-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**
            - id: seckill-product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/seckill/**
            - id: merchant-product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/merchant/**
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/cart/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/orders/**
            - id: support-service
              uri: ${SUPPORT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/guide/turns/stream,/api/support/turns/stream
                - Method=POST

server:
  port: ${GATEWAY_PORT:8080}
jwt:
  secret: ${JWT_SECRET}
