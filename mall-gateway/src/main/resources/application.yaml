spring:
  application:
    name: mall-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**
            - id: merchant-product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/merchant/**
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/cart/**

server:
  port: ${GATEWAY_PORT:8080}
jwt:
  secret: ${JWT_SECRET}
