spring:
  application:
    name: mall-cart-service

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:nesmartmall}
    username: ${RABBITMQ_USERNAME:nesmartmall}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 3s

    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: false

  cloud:
    loadbalancer:
      retry:
        enabled: false

    openfeign:
      client:
        config:
          mall-product-service:
            connectTimeout: 2000
            readTimeout: 5000

      httpclient:
        max-connections: 100
        max-connections-per-route: 20
        time-to-live: 60
        time-to-live-unit: seconds

        hc5:
          enabled: true
          connection-request-timeout: 1
          connection-request-timeout-unit: seconds
          socket-timeout: 5
          socket-timeout-unit: seconds

mybatis:
  mapper-locations: classpath:mapper/*.xml

server:
  # 与网关中的 CART_SERVICE_URL 保持一致。
  port: ${CART_SERVICE_PORT:8083}
