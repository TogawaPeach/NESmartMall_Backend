spring:
  application:
    name: mall-product-service
  # 默认从环境变量读取数据库配置；激活 local 后使用本机 application-local.yaml 中的值。
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  redis:
    address: ${REDIS_ADDRESS:redis://127.0.0.1:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: nesmartmall_tx_group

  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT

  config:
    type: file

  registry:
    type: file

  service:
    vgroup-mapping:
      nesmartmall_tx_group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}

  client:
    tm:
      # 创建订单的全局事务超时，与 15 分钟支付期限无关。
      default-global-transaction-timeout: 60000

mybatis:
  # 加载 Mapper XML；其 namespace 和语句 ID 对应 Mapper 接口及方法。
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.nemall.product.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: INFO
    # 开发调试：Mapper 输出 SQL 及参数，业务层输出查询结果。
    com.nemall.product.mapper: DEBUG
    com.nemall.product.service: DEBUG
    com.nemall.product.controller: DEBUG

server:
  # 与网关中的 PRODUCT_SERVICE_URL 保持一致。
  port: ${PRODUCT_SERVICE_PORT:8082}
