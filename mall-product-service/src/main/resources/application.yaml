spring:
  application:
    name: mall-product-service
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.nemall.product.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: INFO
    com.nemall.product.mapper: DEBUG
    com.nemall.product.service: DEBUG
    com.nemall.product.controller: DEBUG

server:
  port: ${PRODUCT_SERVICE_PORT:8082}
